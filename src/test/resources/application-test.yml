    secret: dGhpcy1pcy1hLXZlcnktc2VjdXJlLTI1Ni1iaXQtc2VjcmV0LWtleS1mb3ItbmV4YmlsbC1tdWx0aS10ZW5hbnQtYXBwbGljYXRpb24=
    expiration-ms: 3600000
    issuer: nexbill-test
  cors:
    allowed-origins:
      - http://localhost:5173
